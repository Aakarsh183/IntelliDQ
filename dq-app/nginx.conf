server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Create React App is a single-page app: any unknown path must be handed to
    # index.html so client-side routing resolves it, instead of returning nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRA fingerprints these filenames with a content hash, so they can be cached hard.
    location /static/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or browsers keep loading the old bundle after a
    # deploy and reference hashed assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip             on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
