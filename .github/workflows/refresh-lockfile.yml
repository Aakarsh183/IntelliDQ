# Utility workflow - not part of CI.
#
# dq-app/package-lock.json was generated by an older npm than the one shipping with
# Node 20, which resolves optional peer dependencies into the ideal tree (tailwindcss
# -> postcss-load-config@6 -> optional peer yaml@^2.4.2). The lock has no yaml@2.x
# entry, so `npm ci` correctly refuses to install from it.
#
# Run this manually (Actions -> Refresh frontend lockfile -> Run workflow), download
# the package-lock.json artifact, and commit it to dq-app/. Delete this workflow once
# the lock is regenerated - it exists only because no one on the team has Node locally.
#
# If you do have Node 20 installed, skip all of this:
#   cd dq-app && npm install && git add package-lock.json

name: Refresh frontend lockfile

on:
  workflow_dispatch:

jobs:
  refresh:
    name: regenerate dq-app/package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate lockfile
        working-directory: dq-app
        # --package-lock-only resolves the full tree and rewrites the lock without
        # unpacking node_modules, so this finishes in seconds.
        run: npm install --package-lock-only

      - name: Show what changed
        working-directory: dq-app
        run: |
          npm --version
          git --no-pager diff --stat -- package-lock.json

      - name: Verify npm ci now succeeds against the new lockfile
        working-directory: dq-app
        run: npm ci

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-json
          path: dq-app/package-lock.json
          if-no-files-found: error
