name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref. With 5 devs pushing frequently this is
# the single biggest saver of Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # PySpark needs a JVM. ubuntu-latest ships one, but pinning it means a
      # runner-image update cannot silently change our Java version.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # column_resolver.py imports sentence_transformers at module scope, which
          # requires torch. The default PyPI wheel bundles CUDA (~2.5 GB) and these
          # runners have no GPU, so install the CPU-only wheel first (~200 MB) and
          # let the resolver see torch as already satisfied.
          pip install --index-url https://download.pytorch.org/whl/cpu torch

          if [ -f backend/requirements.lock.txt ]; then
            pip install -r backend/requirements.lock.txt
          else
            echo "::warning::backend/requirements.lock.txt not found - installing unpinned backend/requirements.txt. Generate the lock file to make CI reproducible."
            pip install -r backend/requirements.txt
          fi

          pip install -r backend/requirements-dev.txt

      # Blocking: syntax errors and undefined names only. These are always genuine
      # bugs, never style opinions, so they can gate the build from day one.
      - name: Lint (blocking - errors only)
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      # Advisory: the full style report lands in the log but never fails the build.
      # Categories move from here into the blocking step as the team cleans them up.
      - name: Lint (advisory - full style report)
        run: flake8 backend --count --exit-zero --statistics

      - name: Run unit tests with coverage
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      # Docker steps run last on purpose. The image is large (torch + pyspark + a JVM,
      # roughly 2.5-3 GB) and takes minutes to build, so there is no point paying for it
      # on a commit whose tests already failed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: intellidq-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building only proves the Dockerfile is valid; it does not prove the app starts.
      # That distinction matters here: the JAVA_HOME and AzureOpenAI-at-import problems
      # are both runtime failures that a successful build would happily hide.
      #
      # The Azure values are deliberate throwaways. Constructing an AzureOpenAI client
      # performs no network I/O, so this satisfies the import without touching a live
      # endpoint - CI must never call a real LLM: it is slow, costs money and flakes.
      - name: Smoke-test the image
        run: |
          docker run -d --name dq -p 8000:8000 \
            -e AZURE_OPENAI_API_KEY=placeholder-key-not-used-in-ci \
            -e AZURE_OPENAI_ENDPOINT=https://placeholder.invalid/ \
            -e AZURE_OPENAI_API_VERSION=2024-02-01 \
            -e AZURE_OPENAI_DEPLOYMENT=placeholder-deployment \
            intellidq-backend:${{ github.sha }}

          # Up to 120s: importing torch, transformers and pyspark is genuinely slow on a
          # cold container, and a too-short timeout here reads as a crash.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/docs > /dev/null 2>&1; then
              echo "app is up after ~$((i * 2))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dq)" != "true" ]; then
              echo "container exited early"
              break
            fi
            sleep 2
          done

          echo "::error::app failed to start - container logs follow"
          docker logs dq
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs dq || true

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dq-app/package-lock.json

      # Pinned so this job's dependency resolution cannot drift when setup-node starts
      # shipping a newer Node 20 patch (and with it a newer bundled npm).
      - name: Pin npm
        run: npm install -g npm@10.9.2

      # No --legacy-peer-deps flag here on purpose: dq-app/.npmrc sets it for every npm
      # invocation in that directory, so local installs and this job build an
      # identically-shaped tree. See that file for why it is needed at all.
      - name: Install dependencies
        working-directory: dq-app
        run: |
          npm --version
          npm config get legacy-peer-deps
          npm ci

      - name: Test
        working-directory: dq-app
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        working-directory: dq-app
        run: npm run build
